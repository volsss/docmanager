name: Convert MD to DOCX
on:
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pandoc
        uses: pandoc/actions/setup@v1

      - name: Convert MD to DOCX preserving structure
        run: |
          mkdir -p docx_output

          find docs -type f -name "*.md" | while read -r file; do
            dir_name=$(dirname "$file")

            mkdir -p "docx_output/$dir_name"

            output_file="docx_output/${file%.md}.docx"

            echo "Converting $file -> $output_file"
            pandoc -f gfm "$file" --resource-path=".:$dir_name" -o "$output_file"
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: docx-documents
          path: docx_output
          if-no-files-found: error
