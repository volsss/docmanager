name: Convert MD to DOCX
on:
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - ".github/workflows/**"
      - "**.lua"
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pandoc
        uses: pandoc/actions/setup@v1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Mermaid filter
        run: npm install --global mermaid-filter

      - name: Cache Mermaid CLI and Chrome
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/mermaid-cli
            ~/.cache/puppeteer
          key: mermaid-cli-11.17.0-chrome-157

      - name: Install Mermaid CLI and Chrome
        shell: bash
        run: |
          set -euo pipefail

          CLI_DIR="$RUNNER_TEMP/mermaid-cli"

          if [ ! -f "$CLI_DIR/node_modules/.bin/mmdc" ]; then
            rm -rf "$CLI_DIR"
            npm install \
              --prefix "$CLI_DIR" \
              --no-audit \
              --no-fund \
              --save-exact \
              @mermaid-js/mermaid-cli@11.17.0
          fi

          MMDC="$CLI_DIR/node_modules/.bin/mmdc"

          echo "Installed Mermaid CLI version:"
          "$MMDC" --version

          # Install Chrome-headless-shell for Puppeteer
          PUPPETEER_DIR="$CLI_DIR/node_modules/puppeteer-core"
          if [ ! -d "$HOME/.cache/puppeteer/chrome-headless-shell" ]; then
            echo "Installing Chrome-headless-shell..."
            cd "$CLI_DIR"
            npx puppeteer browsers install chrome-headless-shell
            cd -
          fi

          echo "Checking legacy options required by mermaid-filter:"
          "$MMDC" --help | grep -E -- '-w, --width|-f, --pdfFit'

          echo "MERMAID_FILTER_CMD_MMDC=$MMDC" >> "$GITHUB_ENV"

      - name: Convert MD to DOCX preserving structure
        run: |
          mkdir -p docx_output
          
          mapfile -d '' files < <(find docs -type f -name "*.md" -print0)
          total=${#files[@]}
          count=0

          for file in "${files[@]}"; do
            count=$((count + 1))
            percentage=$((count * 100 / total))
            filled=$((percentage / 5))
            empty=$((20 - filled))

            bar=$(printf '%0.s█' $(seq 1 $filled) $(seq 1 $empty | sed 's/.//g'))
            empty_bar=$(printf '%0.s░' $(seq 1 $empty))

            printf "\r[\033[32m%s%s\033[0m] %3d%% (%d/%d) %s" "$bar" "$empty_bar" "$percentage" "$count" "$total" "$file"

            dir_name=$(dirname "$file")
            mkdir -p "docx_output/$dir_name"
            output_file="docx_output/${file%.md}.docx"
          
            pandoc --from=gfm \
              --reference-doc=docs/reference.docx \
              --toc --toc-depth=2 \
              --metadata=toc-title="Содержание" \
              --lua-filter=docs/alerts.lua \
              --filter=mermaid-filter \
              --resource-path=".:$dir_name" \
              --output="$output_file" \
              "$file"
          done
          echo ""

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docx_output
          if-no-files-found: error
