name: Convert MD to DOCX
on:
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pandoc
        uses: pandoc/actions/setup@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Mermaid filter
        run: npm install --global mermaid-filter

      - name: Install Mermaid CLI
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mermaid-cli"

          npm install \
            --prefix "$RUNNER_TEMP/mermaid-cli" \
            --no-audit \
            --no-fund \
            @mermaid-js/mermaid-cli@12.0.0

          MMDC="$RUNNER_TEMP/mermaid-cli/node_modules/.bin/mmdc"

          "$MMDC" --version

          echo "MERMAID_FILTER_CMD_MMDC=$MMDC" >> "$GITHUB_ENV"

      - name: Convert MD to DOCX preserving structure
        run: |
          mkdir -p docx_output

          find docs -type f -name "*.md" | while read -r file; do
            dir_name=$(dirname "$file")

            mkdir -p "docx_output/$dir_name"

            output_file="docx_output/${file%.md}.docx"

            echo "Converting $file -> $output_file"
            pandoc \
              --from=gfm \
              --filter=mermaid-filter \
              --resource-path=".:$dir_name" \
              --output="$output_file" \
              "$file"
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: docx-documents
          path: docx_output
          if-no-files-found: error
