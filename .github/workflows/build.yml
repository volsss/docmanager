name: Build
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
env:
  app_name: docmanager

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up latest JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: latest
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Cache Kotlin Native Compiler
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/libs.versions.toml', '**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Android App (Debug)
        run: ./gradlew :androidApp:assembleDebug
      - name: Naming Artifacts
        run: mv androidApp/build/outputs/apk/debug/*.apk androidApp/build/outputs/apk/debug/${{ env.app_name }}_${{ runner.os }}-Android-Debug_${{ github.run_number }}.apk
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v7
        with:
          path: androidApp/build/outputs/apk/debug/${{ env.app_name }}_${{ runner.os }}-Android-Debug_${{ github.run_number }}.apk
          archive: 'false'

  dmg-arm:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up latest JDK
        uses: actions/setup-java@v6
