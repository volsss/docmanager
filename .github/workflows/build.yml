  build-exe-distributable:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up latest JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: latest
