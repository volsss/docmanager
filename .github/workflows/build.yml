          key: ${{ runner.os }}-konan-${{ hashFiles('**/libs.versions.toml', '**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build EXE Distributable
        run: ./gradlew :desktopApp:createDistributable
      - name: Upload EXE Distributable Artifact
        uses: actions/upload-artifact@v7
        with:
          name: docmanager-distributable
          path: desktopApp/build/compose/binaries/main/app/